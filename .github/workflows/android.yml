name: Android

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "protocol/**"
      - "VERSION"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "protocol/**"
      - "VERSION"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # Prefix literal: saat dipanggil release.yml, github.workflow berisi nama pemanggil ("Release"),
    # jadi build rilis tidak membatalkan build biasa di main yang jalan bersamaan.
    concurrency:
      group: android-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Siapkan keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 belum ada, APK ditandatangani debug key dan tidak bisa menimpa versi sebelumnya."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test dan build APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleRelease

      - name: Beri nama APK
        id: apk
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          name="armrest-android-${version}-b${GITHUB_RUN_NUMBER}.apk"
          mkdir -p dist
          cp android-app/app/build/outputs/apk/release/app-release.apk "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # archive: false → artifact diunduh sebagai file .apk langsung, bukan zip.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.apk.outputs.name }}
          archive: false
          retention-days: 30
          if-no-files-found: error
